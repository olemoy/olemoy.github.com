<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jaaddan Points Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
html, body, #map { height: 100%; margin: 0; }

/* Keep controls clear of the notch and home bar (viewport-fit=cover) */
.leaflet-top { top: env(safe-area-inset-top); }
.leaflet-bottom { bottom: env(safe-area-inset-bottom); }
.leaflet-left { left: env(safe-area-inset-left); }
.leaflet-right { right: env(safe-area-inset-right); }

/* Point name labels */
.label { background: rgba(255,255,255,.85); border: 0; box-shadow: none; font: 12px sans-serif; padding: 1px 4px; cursor: pointer; }
.hide-point-labels .label { display: none; }

/* Parcel gnr/bnr labels */
.teig-label { background: none; border: 0; box-shadow: none; color: #b00000; font: bold 11px sans-serif; text-shadow: 0 0 3px #fff, 0 0 3px #fff; }
.teig-label::before { display: none; }
.hide-teig-labels .teig-label { display: none; }

/* Right-hand panel: layer options + edit/export */
.panel-toggle { display: block; width: 100%; font: inherit; padding: 2px 8px; cursor: pointer; }
.panel-hidden .leaflet-control-layers-list { display: none; }
.panel-hidden .panel-toggle { width: auto; }
.edit-control { display: flex; flex-direction: column; gap: 4px; }
.edit-control button { font: inherit; padding: 4px 8px; cursor: pointer; }
.edit-control button.active { background: #1f4fd6; color: #fff; border-color: #1f4fd6; }
.edit-control .hint { display: none; font-size: 12px; color: #333; }
.edit-control.editing .hint { display: block; }

/* In edit mode parcels must not swallow clicks meant for the map */
.edit-mode { cursor: crosshair; }
.edit-mode .leaflet-overlay-pane svg path.leaflet-interactive { pointer-events: none; }

/* Touch editing: crosshair in the middle of the map, with an add/done bar below it */
.crosshair, .edit-bar { display: none; }
.edit-mode .crosshair { display: block; position: absolute; left: 50%; top: 50%; width: 36px; height: 36px; margin: -18px 0 0 -18px; z-index: 700; pointer-events: none; }
.crosshair::before, .crosshair::after { content: ""; position: absolute; background: #1f4fd6; box-shadow: 0 0 0 1px #fff; }
.crosshair::before { left: 17px; top: 0; width: 2px; height: 36px; }
.crosshair::after { left: 0; top: 17px; width: 36px; height: 2px; }
.edit-mode .edit-bar {
  display: grid; grid-template-columns: 1fr auto; gap: 8px;
  position: absolute; z-index: 1000; left: 50%; transform: translateX(-50%);
  bottom: calc(40px + env(safe-area-inset-bottom)); width: min(360px, calc(100% - 32px)); box-sizing: border-box;
  padding: 8px; border-radius: 12px; background: #fff; box-shadow: 0 2px 12px rgba(0,0,0,.3); font: 16px sans-serif;
}
.edit-bar .hint { grid-column: 1 / -1; font-size: 14px; color: #333; }
.edit-bar button { font: inherit; min-height: 44px; padding: 0 16px; cursor: pointer; }
.edit-bar .add { background: #1f4fd6; color: #fff; border: 1px solid #1f4fd6; border-radius: 6px; }

/* "Show my position" button, blue while following */
.locate a { display: flex; align-items: center; justify-content: center; color: #333; }
.locate a.active { color: #0a84ff; }

/* Phones: the open panel becomes a bottom sheet across the full width */
@media (max-width: 639px) {
  .leaflet-control-layers:not(.panel-hidden) {
    position: fixed; left: 0; right: 0; bottom: 0; margin: 0;
    max-height: 60dvh; overflow-y: auto;
    padding: 8px 16px calc(12px + env(safe-area-inset-bottom));
    border-radius: 12px 12px 0 0; box-shadow: 0 -2px 12px rgba(0,0,0,.3);
  }
  /* The sheet lives in the top corner's stacking context; lift it over the scale and attribution */
  .leaflet-top { z-index: 1001; }
  /* Leaflet sizes the list for the corner position; the sheet scrolls instead */
  .leaflet-control-layers-list { height: auto !important; overflow: visible !important; padding-right: 0 !important; }
  .edit-control { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .edit-control .toggle, .edit-control .hint, .edit-control .count { grid-column: 1 / -1; }
}

/* Touch screens: finger-sized buttons and rows */
@media (pointer: coarse) {
  .leaflet-control-layers { font-size: 16px; }
  .panel-toggle, .edit-control button { min-height: 44px; }
  .edit-control .hint { font-size: 14px; }
  .leaflet-control-layers label { padding: 6px 0; }
  .leaflet-control-layers input { width: 20px; height: 20px; vertical-align: middle; }
  .leaflet-touch .leaflet-bar a { width: 44px; height: 44px; line-height: 44px; }
}

</style>

<script>
// Map page logic. make_map.py inlines this into build/map.html, after a
// script that defines MAP_DATA = { version: "YYYY-MM-DD", points: [...], parcels: FeatureCollection }.
const csvPoints = MAP_DATA.points;
const parcels = MAP_DATA.parcels;

const osm = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19, attribution: "&copy; OpenStreetMap contributors" });
const topo = L.tileLayer("https://cache.kartverket.no/v1/wmts/1.0.0/topo/default/webmercator/{z}/{y}/{x}.png", {
  maxZoom: 18, attribution: "&copy; Kartverket" });
const map = L.map("map", { layers: [topo] });
// View must be set before parcel label positions can be computed
map.fitBounds(L.latLngBounds(csvPoints.map(p => [p.lat, p.lon])).pad(0.2));

// Forward transverse Mercator (Krüger series), WGS84 -> UTM 33N, inverse of make_map.py
function latLonToUtm33(lat, lon) {
  const a = 6378137, f = 1 / 298.257223563, k0 = 0.9996;
  const n = f / (2 - f);
  const aHat = a / (1 + n) * (1 + n ** 2 / 4 + n ** 4 / 64);
  const alpha = [n / 2 - 2 * n ** 2 / 3 + 5 * n ** 3 / 16, 13 * n ** 2 / 48 - 3 * n ** 3 / 5, 61 * n ** 3 / 240];
  const phi = lat * Math.PI / 180, lam = (lon - 15) * Math.PI / 180;
  const c = 2 * Math.sqrt(n) / (1 + n);
  const t = Math.sinh(Math.atanh(Math.sin(phi)) - c * Math.atanh(c * Math.sin(phi)));
  const xiP = Math.atan2(t, Math.cos(lam));
  const etaP = Math.atanh(Math.sin(lam) / Math.sqrt(1 + t * t));
  let xi = xiP, eta = etaP;
  alpha.forEach((al, i) => {
    const j = 2 * (i + 1);
    xi += al * Math.sin(j * xiP) * Math.cosh(j * etaP);
    eta += al * Math.cos(j * xiP) * Math.sinh(j * etaP);
  });
  return { northing: k0 * aHat * xi, easting: 500000 + k0 * aHat * eta };
}

const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function popupHtml(p) {
  return `<b>${esc(p.name)}</b>${p.desc && p.desc !== p.name ? "<br>" + esc(p.desc) : ""}` +
         `<br>GPS (WGS84): ${p.lat.toFixed(6)}° N, ${p.lon.toFixed(6)}° Ø` +
         `<br><small>UTM 33 (EUREF89): N ${p.northing.toFixed(2)}, Ø ${p.easting.toFixed(2)}</small>`;
}

// Touch screens get bigger point tap areas; narrow screens get fewer labels and a closed panel
const touchScreen = matchMedia("(pointer: coarse)").matches;
const narrowScreen = matchMedia("(max-width: 639px)");

let editMode = false;
let dirty = false;  // unsaved changes, cleared by an export
let edited = false; // points differ from the built version, so exports are a new version

function addPointMarker(p) {
  // bubblingMouseEvents off: a click on a point must not also count as a click on the map
  const marker = L.circleMarker([p.lat, p.lon], { pane: "points", radius: touchScreen ? 8 : 6, color: "#1f4fd6", fillOpacity: .8, bubblingMouseEvents: false })
    // interactive: clicking the name label does the same as clicking the dot
    .bindTooltip(esc(p.name), { permanent: true, interactive: true, direction: "right", offset: [8, 0], className: "label" });
  // On touch screens an invisible, finger-sized circle under the dot takes the tap
  const hitArea = touchScreen && L.circleMarker([p.lat, p.lon], { pane: "pointHits", radius: 22, stroke: false, fillOpacity: 0, bubblingMouseEvents: false });
  const point = L.featureGroup(hitArea ? [hitArea, marker] : [marker])
    .on("click", e => {
      L.DomEvent.stop(e);
      if (!editMode) {
        L.popup().setLatLng(marker.getLatLng()).setContent(popupHtml(p)).openOn(map);
      } else if (confirm(`Remove "${p.name}"?`)) {
        csvPoints.splice(csvPoints.indexOf(p), 1);
        pointLayer.removeLayer(point);
        dirty = edited = true;
        updateCount();
      }
    });
  pointLayer.addLayer(point);
}

function addPointAt({ lat, lng }) {
  const name = prompt("Name of new point:");
  if (!name || !name.trim()) return;
  const desc = prompt("Comment (optional):", name.trim());
  const p = { name: name.trim(), desc: (desc ?? "").trim(), lat, lon: lng, ...latLonToUtm33(lat, lng) };
  csvPoints.push(p);
  addPointMarker(p);
  dirty = edited = true;
  updateCount();
}

// Touch screens add points with the crosshair instead: a fingertip hides the spot,
// and the end of a pan would add points by accident
map.on("click", e => { if (editMode && !touchScreen) addPointAt(e.latlng); });

window.addEventListener("beforeunload", e => { if (dirty) e.preventDefault(); });

// Exports: CSV in make_map's own format, GPX for Garmin and other GPS apps.
// Edited points are a new version, dated today.
function exportVersion() {
  if (!edited) return MAP_DATA.version;
  const d = new Date();
  return [d.getFullYear(), d.getMonth() + 1, d.getDate()].map(n => String(n).padStart(2, "0")).join("-");
}
function csvField(s) {
  return /[",\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
}
function mapCsv() {
  return csvPoints.map(p => [p.northing.toFixed(2), p.easting.toFixed(2), csvField(p.name), csvField(p.desc)].join(",")).join("\n") + "\n";
}
function gpx(version) {
  const wpts = csvPoints.map(p =>
    `  <wpt lat="${p.lat.toFixed(6)}" lon="${p.lon.toFixed(6)}">\n` +
    `    <name>${esc(p.name)}</name>\n` +
    (p.desc ? `    <desc>${esc(p.desc)}</desc>\n` : "") +
    `  </wpt>\n`).join("");
  return `<?xml version="1.0" encoding="UTF-8"?>\n` +
    `<gpx version="1.1" creator="jaadan-gps" xmlns="http://www.topografix.com/GPX/1/1">\n` +
    `  <metadata><name>Jåddan steder ${version}</name></metadata>\n` +
    wpts + `</gpx>\n`;
}
// On touch screens the share sheet hands the file straight to a GPS app, Files or AirDrop.
// Elsewhere, or when the browser can't share this file type, the file is downloaded.
async function saveFile(text, filename, type) {
  const file = new File([text], filename, { type });
  if (touchScreen && navigator.canShare?.({ files: [file] })) {
    try {
      await navigator.share({ files: [file] });
      dirty = false;
    } catch (err) {
      // AbortError: the share sheet was closed without saving
      if (err.name !== "AbortError") download(file);
    }
    return;
  }
  download(file);
}
function download(file) {
  const link = document.createElement("a");
  link.href = URL.createObjectURL(file);
  link.download = file.name;
  link.click();
  // Revoking right away can cancel the download in some browsers
  setTimeout(() => URL.revokeObjectURL(link.href), 1000);
  dirty = false;
}

// Edit/export buttons; placed in the layers panel once that exists
const editPanel = (() => {
  const div = L.DomUtil.create("div", "edit-control");
  div.innerHTML =
    `<button class="toggle">Edit points</button>` +
    `<div class="hint">${touchScreen
      ? "Move the map so the crosshair is on the spot, then tap <b>Add point here</b>.<br>Tap a point to remove it."
      : "Click the map to add a point.<br>Click a point to remove it."}</div>` +
    `<button class="export-csv">Export CSV</button>` +
    `<button class="export-gpx">Export GPX</button>` +
    `<div class="count"></div>`;
  div.querySelector(".toggle").onclick = () => setEditMode(!editMode);
  div.querySelector(".export-csv").onclick = () =>
    saveFile(mapCsv(), `Jaaddan-steder-${exportVersion()}.csv`, "text/csv");
  div.querySelector(".export-gpx").onclick = () => {
    const version = exportVersion();
    saveFile(gpx(version), `Jaaddan-steder-${version}.gpx`, "application/gpx+xml");
  };
  return div;
})();
function setEditMode(on) {
  editMode = on;
  editPanel.querySelector(".toggle").classList.toggle("active", on);
  editPanel.classList.toggle("editing", on);
  map.getContainer().classList.toggle("edit-mode", on);
  map.closePopup();
  // Phones: close the sheet so the map and the crosshair are in view
  if (on && narrowScreen.matches) setPanelHidden(true);
}

// Touch editing: a crosshair in the middle of the map marks where "Add point here" puts the point
if (touchScreen) {
  L.DomUtil.create("div", "crosshair", map.getContainer());
  const bar = L.DomUtil.create("div", "edit-bar", map.getContainer());
  bar.innerHTML =
    `<div class="hint">Tap a point to remove it.</div>` +
    `<button class="add">Add point here</button>` +
    `<button class="done">Done</button>`;
  L.DomEvent.disableClickPropagation(bar);
  bar.querySelector(".add").onclick = () => addPointAt(map.getCenter());
  bar.querySelector(".done").onclick = () => setEditMode(false);
}
function updateCount() {
  editPanel.querySelector(".count").textContent =
    `${csvPoints.length} points · version ${exportVersion()}${edited ? " (edited)" : ""}`;
}

// Points get their own pane above the parcels so clicks always reach them
map.createPane("points").style.zIndex = 450;
map.createPane("pointHits").style.zIndex = 449; // below the dots, so a tap on a dot is never taken by a neighbour's hit area

const parcelLayer = L.geoJSON(parcels, {
  style: { color: "#e00000", weight: 2, fillColor: "#e00000", fillOpacity: .04 },
  onEachFeature: (f, layer) => f.properties.label && layer.bindPopup(
    `<b>Gnr/bnr ${f.properties.label}</b><br>${f.properties.kommune} (${f.properties.kommunenummer})` +
    `<br>Nøyaktighetsklasse: ${f.properties.noyaktighet}`),
}).addTo(map);
const labelLayer = L.layerGroup(parcelLayer.getLayers()
  .filter(layer => layer.feature.properties.label)
  .map(layer => L.tooltip({ permanent: true, direction: "center", className: "teig-label" })
    .setLatLng(layer.getCenter())
    .setContent(layer.feature.properties.label))).addTo(map);
const pointLayer = L.layerGroup().addTo(map);
csvPoints.forEach(addPointMarker);
updateCount();

// Parcel labels only make sense once zoomed in; at overview they pile up.
// On narrow screens the point labels pile up too, so they also wait for a closer zoom.
const LABEL_MIN_ZOOM = 15;
const POINT_LABEL_MIN_ZOOM = 14;
const toggleLabels = () => {
  map.getContainer().classList.toggle("hide-teig-labels", map.getZoom() < LABEL_MIN_ZOOM);
  map.getContainer().classList.toggle("hide-point-labels", narrowScreen.matches && map.getZoom() < POINT_LABEL_MIN_ZOOM);
};
map.on("zoomend resize", toggleLabels);

const layersControl = L.control.layers(
  { "Kartverket topo": topo, "OpenStreetMap": osm },
  { "Points": pointLayer,
    [`Eiendomsgrenser (${parcels.features.length})`]: parcelLayer,
    "Gårds- og bruksnummer": labelLayer },
  { collapsed: false }).addTo(map);

// One panel on the right: layer options + edit/export buttons, with a show/hide toggle
const panel = layersControl.getContainer();
panel.querySelector(".leaflet-control-layers-list").append(
  L.DomUtil.create("div", "leaflet-control-layers-separator"), editPanel);
const panelToggle = L.DomUtil.create("button", "panel-toggle");
const setPanelHidden = hidden => {
  panel.classList.toggle("panel-hidden", hidden);
  panelToggle.textContent = hidden ? "☰ Layers" : "Hide";
};
panelToggle.onclick = () => setPanelHidden(!panel.classList.contains("panel-hidden"));
panel.prepend(panelToggle);
// Phones start with the panel closed so the map gets the screen
setPanelHidden(narrowScreen.matches);
L.control.scale({ imperial: false }).addTo(map);

// "Show my position": follows the GPS position with a dot and an accuracy circle.
// Geolocation needs https (or localhost / file://), so it works from GitHub Pages.
const accuracyCircle = L.circle([0, 0], { radius: 0, interactive: false, color: "#0a84ff", weight: 1, fillOpacity: .12 });
const positionDot = L.circleMarker([0, 0], { radius: 7, interactive: false, color: "#fff", weight: 3, fillColor: "#0a84ff", fillOpacity: 1 });
const myPosition = L.layerGroup([accuracyCircle, positionDot]);
let locating = false;
let centered = false; // only the first fix moves the map, so panning away while following works
const locateControl = L.control({ position: "topleft" });
locateControl.onAdd = () => {
  const bar = L.DomUtil.create("div", "leaflet-bar locate");
  const button = L.DomUtil.create("a", "", bar);
  button.href = "#";
  button.role = "button";
  button.title = "Show my position";
  button.innerHTML =
    `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">` +
    `<circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5" fill="currentColor"/>` +
    `<path d="M12 1v4M12 19v4M1 12h4M19 12h4"/></svg>`;
  L.DomEvent.disableClickPropagation(bar);
  L.DomEvent.on(button, "click", e => { L.DomEvent.preventDefault(e); setLocating(!locating); });
  return bar;
};
locateControl.addTo(map);
function setLocating(on) {
  locating = on;
  locateControl.getContainer().querySelector("a").classList.toggle("active", on);
  if (on) {
    centered = false;
    map.locate({ watch: true, enableHighAccuracy: true, timeout: 30000 });
  } else {
    map.stopLocate();
    myPosition.remove();
  }
}
map.on("locationfound", e => {
  accuracyCircle.setLatLng(e.latlng).setRadius(e.accuracy);
  positionDot.setLatLng(e.latlng);
  if (!map.hasLayer(myPosition)) myPosition.addTo(map);
  if (!centered) {
    map.setView(e.latlng, Math.max(map.getZoom(), 15));
    centered = true;
  }
});
map.on("locationerror", e => {
  // Timeouts and lost signal are passing; the watch keeps trying. A refusal is final.
  if (e.code !== 1) return;
  setLocating(false);
  alert(`Could not show your position: ${e.message}`);
});

toggleLabels();

</script>
</body>
</html>
